<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will You Be Mine?</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
[hidden]{display:none!important}
/* One centered card on a blush ground; single deliberate light look */
:root{
  --bg:#FBEEF1; --ink:#3A1A24; --soft:#6E4552; --rose:#8E2545; --heart:#C2405F; --line:#D9A3B2; --white:#FFFFFF;
  --display:'Fraunces', Georgia, 'Times New Roman', serif;
  --body:'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
.stage{min-height:100%;box-sizing:border-box;display:flex;align-items:center;justify-content:center;padding-block:40px;padding-left:max(24px, env(safe-area-inset-left, 0px));padding-right:max(24px, env(safe-area-inset-right, 0px))}
.card{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center}
.eyebrow{margin:0;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-weight:600}
h1{margin:0;font-family:var(--display);font-weight:400;font-size:44px;line-height:1.08;text-wrap:balance}
h1 em{color:var(--rose)}
.hint{margin:0;font-size:15px;color:var(--soft);min-height:22px}
.row{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:64px}
button{min-width:112px;height:52px;padding:0 28px;border-radius:999px;font-family:inherit;font-size:17px;font-weight:600;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--heart);outline-offset:3px}
#yes{border:none;background:var(--rose);color:var(--white);box-shadow:0 6px 18px rgba(142,37,69,.25);transition:transform .25s ease}
#no{border:1.5px solid var(--line);background:var(--white);color:var(--rose);white-space:nowrap;z-index:10;transition:left .25s ease, top .25s ease}
#no.loose{position:fixed}
.heart{display:block;animation:beat 1.6s ease-in-out infinite;transform-origin:center}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.12)}30%{transform:scale(1)}45%{transform:scale(1.08)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{margin:0;font-family:var(--display);font-weight:400;font-style:italic;font-size:46px;line-height:1.05;color:var(--rose)}
.big{margin:0;font-family:var(--display);font-size:21px;line-height:1.45}
.small{margin:0;font-size:15px;line-height:1.6;color:var(--soft)}
.sign{margin:8px 0 0}
#done .r1{animation:rise .7s ease-out both}
#done .r2{animation:rise .7s ease-out .25s both}
#done .r3{animation:rise .7s ease-out .5s both}
.petal{position:fixed;top:-24px;pointer-events:none;animation:fall linear forwards;z-index:0}
@keyframes fall{to{transform:translateY(110vh) rotate(260deg);opacity:.2}}
@media (prefers-reduced-motion: reduce){.heart,#done *,.petal{animation:none!important}#no,#yes{transition:none}}
</style>
</head>
<body>

<main class="stage">
  <section class="card" id="ask">
    <svg class="heart" width="72" height="72" viewBox="0 0 24 24" fill="#C2405F" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <p class="eyebrow">I have a question</p>
    <h1>Will you be my <em>girlfriend</em>?</h1>
    <p class="hint" id="hint" aria-live="polite"></p>
    <div class="row">
      <button id="yes" type="button">Yes</button>
      <button id="no" type="button">No</button>
    </div>
  </section>

  <section class="card" id="done" hidden>
    <svg class="heart" width="96" height="96" viewBox="0 0 24 24" fill="#C2405F" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>
    <h2 class="r1">I knew it.</h2>
    <p class="big r2">You just made me the happiest person in the world. Every day with you is my favorite day.</p>
    <p class="small r3">Thank you for saying yes. I promise to make you smile every single day.</p>
    <p class="eyebrow sign r3">Forever yours</p>
  </section>
</main>

<script>
(function(){
  var yes = document.getElementById('yes');
  var no = document.getElementById('no');
  var hint = document.getElementById('hint');
  var labels = ['No','Are you sure?','Really?','Think again','Nope, try Yes','Last chance'];
  var hints = ['','Hmm, that button seems shy…','It really doesn’t want to be pressed.','Maybe try the other one?','The Yes button is right there.','Go on, press Yes.'];
  var tries = 0, last = null;

  function flee(e){
    if (e && e.type !== 'pointerenter' && e.cancelable) e.preventDefault();
    tries++;
    var i = Math.min(tries, labels.length - 1);
    no.textContent = labels[i];
    hint.textContent = hints[i];
    yes.style.transform = 'scale(' + Math.min(1 + tries * 0.08, 1.5) + ')';

    var w = window.innerWidth, h = window.innerHeight;
    var bw = no.offsetWidth || 160, bh = no.offsetHeight || 52, m = 16;
    var yr = yes.getBoundingClientRect();
    var x, y, n = 0;
    do {
      x = m + Math.random() * Math.max(w - bw - m * 2, 1);
      y = m + Math.random() * Math.max(h - bh - m * 2, 1);
      n++;
      var hitsYes = x < yr.right + 12 && x + bw > yr.left - 12 && y < yr.bottom + 12 && y + bh > yr.top - 12;
      var tooClose = last && Math.abs(x - last.x) < 90 && Math.abs(y - last.y) < 90;
    } while ((hitsYes || tooClose) && n < 25);
    last = {x:x, y:y};
    if (!no.classList.contains('loose')) {
      var r = no.getBoundingClientRect();
      no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
      no.classList.add('loose');
      void no.offsetWidth;
    }
    no.style.left = Math.round(x) + 'px';
    no.style.top = Math.round(y) + 'px';
  }

  no.addEventListener('pointerenter', function(e){ if (e.pointerType === 'mouse') flee(e); });
  no.addEventListener('pointerdown', flee);
  no.addEventListener('touchstart', flee, {passive:false});
  no.addEventListener('click', flee);

  yes.addEventListener('click', function(){
    document.getElementById('ask').hidden = true;
    no.hidden = true;
    document.getElementById('done').hidden = false;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var k = 0; k < 22; k++) {
      (function(k){
        setTimeout(function(){
          var s = document.createElementNS('http://www.w3.org/2000/svg','svg');
          var size = 12 + Math.random() * 14;
          s.setAttribute('viewBox','0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
          s.setAttribute('aria-hidden','true'); s.setAttribute('class','petal');
          s.innerHTML = '<path fill="' + (Math.random() < .5 ? '#C2405F' : '#E7A1B3') + '" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/>';
          s.style.left = (Math.random() * 100) + 'vw';
          s.style.animationDuration = (4 + Math.random() * 3) + 's';
          document.body.appendChild(s);
          setTimeout(function(){ s.remove(); }, 8000);
        }, k * 140);
      })(k);
    }
  });
})();
</script>
</body>
</html>
