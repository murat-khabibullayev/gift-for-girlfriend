<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Will You Be Mine?</title>
  <meta name="claude:viewport-fit-sides" content="cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=DM+Sans:wght@400;500;600&display=swap">
  <style>
    body {
      margin: 0
    }

    [hidden] {
      display: none !important
    }

    /* One centered card on a blush ground; single deliberate light look */
    :root {
      --bg: #FBEEF1;
      --ink: #3A1A24;
      --soft: #6E4552;
      --rose: #8E2545;
      --heart: #C2405F;
      --line: #D9A3B2;
      --white: #FFFFFF;
      --display: 'Fraunces', Georgia, 'Times New Roman', serif;
      --body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      color-scheme: light;
    }

    html,
    body {
      height: 100%
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: var(--body);
      overflow: hidden;
      -webkit-tap-highlight-color: transparent
    }

    .stage {
      min-height: 100%;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-block: 40px;
      padding-left: max(24px, env(safe-area-inset-left, 0px));
      padding-right: max(24px, env(safe-area-inset-right, 0px))
    }

    .card {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 26px;
      text-align: center
    }

    .eyebrow {
      margin: 0;
      font-size: 13px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--rose);
      font-weight: 600
    }

    h1 {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-size: 44px;
      line-height: 1.08;
      text-wrap: balance
    }

    h1 em {
      color: var(--rose)
    }

    .hint {
      margin: 0;
      font-size: 15px;
      color: var(--soft);
      min-height: 22px
    }

    .row {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      min-height: 64px
    }

    button {
      min-width: 112px;
      height: 52px;
      padding: 0 28px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation
    }

    button:focus-visible {
      outline: 3px solid var(--heart);
      outline-offset: 3px
    }

    #yes {
      border: none;
      background: var(--rose);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(142, 37, 69, .25);
      transition: transform .25s ease
    }

    #no {
      border: 1.5px solid var(--line);
      background: var(--white);
      color: var(--rose);
      white-space: nowrap;
      z-index: 10;
      transition: left .25s ease, top .25s ease
    }

    #no {
      position: relative
    }

    #no.loose {
      position: fixed
    }

    #no[data-msg]::after {
      content: attr(data-msg);
      position: absolute;
      bottom: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      background: var(--rose);
      color: var(--white);
      font-size: 13px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 12px;
      white-space: nowrap;
      pointer-events: none;
      box-shadow: 0 4px 12px rgba(142, 37, 69, .25)
    }

    #no[data-msg]::before {
      content: '';
      position: absolute;
      bottom: calc(100% + 4px);
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: var(--rose);
      border-bottom: 0;
      pointer-events: none
    }

    .heart {
      display: block;
      animation: beat 1.6s ease-in-out infinite;
      transform-origin: center
    }

    @keyframes beat {

      0%,
      100% {
        transform: scale(1)
      }

      15% {
        transform: scale(1.12)
      }

      30% {
        transform: scale(1)
      }

      45% {
        transform: scale(1.08)
      }
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    h2 {
      margin: 0;
      font-family: var(--display);
      font-weight: 400;
      font-style: italic;
      font-size: 46px;
      line-height: 1.05;
      color: var(--rose)
    }

    .big {
      margin: 0;
      font-family: var(--display);
      font-size: 21px;
      line-height: 1.45
    }

    .small {
      margin: 0;
      font-size: 15px;
      line-height: 1.6;
      color: var(--soft)
    }

    .sign {
      margin: 8px 0 0
    }

    #done .r1 {
      animation: rise .7s ease-out both
    }

    #done .r2 {
      animation: rise .7s ease-out .25s both
    }

    #done .r3 {
      animation: rise .7s ease-out .5s both
    }

    .petal {
      position: fixed;
      top: -24px;
      pointer-events: none;
      animation: fall linear forwards;
      z-index: 0
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(260deg);
        opacity: .2
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .heart,
      #done *,
      .petal {
        animation: none !important
      }

      #no,
      #yes {
        transition: none
      }
    }

    /* ---- Story game ---- */
    .cta {
      border: none;
      background: var(--rose);
      color: var(--white);
      box-shadow: 0 6px 18px rgba(142, 37, 69, .25)
    }

    .ghost {
      border: 1.5px solid var(--line);
      background: var(--white);
      color: var(--rose)
    }

    #story .step {
      font-size: 12px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--soft);
      margin: 0
    }

    .dots {
      display: flex;
      gap: 8px
    }

    .dots i {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--line);
      transition: all .3s
    }

    .dots i.on {
      background: var(--rose);
      width: 22px;
      border-radius: 8px
    }

    .q {
      margin: 0;
      font-family: var(--display);
      font-size: 32px;
      line-height: 1.15;
      font-weight: 400;
      text-wrap: balance
    }

    .opts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%
    }

    .opts.one {
      grid-template-columns: 1fr
    }

    .opt {
      height: auto;
      min-width: 0;
      padding: 16px 10px;
      border-radius: 20px;
      border: 1.5px solid var(--line);
      background: var(--white);
      color: var(--ink);
      font-size: 15px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: transform .2s, border-color .2s, background .2s;
      animation: rise .5s ease-out both
    }

    .opt b {
      font-size: 28px;
      line-height: 1
    }

    .opt small {
      font-size: 12px;
      color: var(--soft);
      font-weight: 400
    }

    .opt:active {
      transform: scale(.96)
    }

    .opt.picked {
      border-color: var(--rose);
      background: #F7DCE3
    }

    .opt.murat {
      padding: 22px;
      font-size: 20px;
      font-family: var(--display)
    }

    .flee {
      position: fixed;
      z-index: 10;
      transition: left .25s, top .25s
    }

    #story .card-in {
      animation: rise .5s ease-out both
    }

    /* Dream (final) screen */
    #dream {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: radial-gradient(ellipse at 50% 30%, #3A1A2C 0%, #140810 75%) fixed;
      color: #F6E7EC;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 0 28px;
      box-sizing: border-box;
      opacity: 0;
      transition: opacity 1.6s ease
    }

    #dream.show {
      opacity: 1
    }

    #dream .lines {
      position: relative;
      z-index: 1;
      max-width: 360px;
      margin: 0 auto;
      padding: 45vh 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    #dream p {
      margin: 0;
      font-family: var(--display);
      font-size: 22px;
      line-height: 1.45;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 1.8s ease, transform 1.8s ease
    }

    #dream p.in {
      opacity: 1;
      transform: none
    }

    #dream p.hl {
      color: #F2A7BC;
      font-style: italic
    }

    #dream .cta {
      align-self: center;
      margin-top: 10px;
      background: #F2A7BC;
      color: #3A1A24;
      opacity: 0;
      transition: opacity 1.5s
    }

    #dream .cta.in {
      opacity: 1
    }

    .star {
      position: fixed;
      width: 2px;
      height: 2px;
      border-radius: 50%;
      background: #fff;
      animation: tw 3s ease-in-out infinite
    }

    @keyframes tw {

      0%,
      100% {
        opacity: .15
      }

      50% {
        opacity: .9
      }
    }

    #yt {
      position: fixed;
      width: 1px;
      height: 1px;
      left: -10px;
      bottom: 0;
      opacity: 0;
      pointer-events: none
    }
  </style>
</head>

<body>

  <main class="stage">
    <section class="card" id="ask">
      <svg class="heart" width="72" height="72" viewBox="0 0 24 24" fill="#C2405F" aria-hidden="true">
        <path
          d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z" />
      </svg>
      <p class="eyebrow">I have a question</p>
      <h1>Will you be my <em>girlfriend</em>?</h1>
      <p class="hint" id="hint" aria-live="polite"></p>
      <div class="row">
        <button id="yes" type="button">Yes</button>
        <button id="no" type="button">No</button>
      </div>
    </section>

    <section class="card" id="done" hidden>
      <svg class="heart" width="96" height="96" viewBox="0 0 24 24" fill="#C2405F" aria-hidden="true">
        <path
          d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z" />
      </svg>
      <h2 class="r1">I knew it.</h2>
      <p class="big r2">You just made me the happiest person in the world. Every day with you is my favorite day.</p>
      <p class="small r3">Thank you for saying yes. I promise to make you smile every single day.</p>
      <button type="button" class="cta r3" id="more">I prepared something for you &rarr;</button>
    </section>

    <section class="card" id="story" hidden></section>
  </main>

  <div id="dream" hidden>
    <div class="lines" id="dreamLines"></div>
  </div>
  <audio id="song" preload="none" loop></audio>

  <script>
    (function () {
      var yes = document.getElementById('yes');
      var no = document.getElementById('no');
      var hint = document.getElementById('hint');
      var labels = ['No', 'Are you sure?', 'Really?', 'Think again', 'Nope, try Yes', 'Last chance'];
      var hints = ['', 'Hmm, that button seems shy…', 'It really doesn’t want to be pressed.', 'Maybe try the other one?', 'The Yes button is right there.', 'Go on, press Yes.'];
      var tries = 0, last = null;

      function flee(e) {
        if (e && e.type !== 'pointerenter' && e.cancelable) e.preventDefault();
        tries++;
        var i = Math.min(tries, labels.length - 1);
        no.setAttribute('data-msg', labels[i]);
        hint.textContent = hints[i];
        yes.style.transform = 'scale(' + Math.min(1 + tries * 0.08, 1.5) + ')';

        var w = window.innerWidth, h = window.innerHeight;
        var bw = no.offsetWidth || 160, bh = no.offsetHeight || 52, m = 16;
        var yr = yes.getBoundingClientRect();
        var x, y, n = 0;
        do {
          x = m + Math.random() * Math.max(w - bw - m * 2, 1);
          y = 56 + Math.random() * Math.max(h - bh - 56 - m, 1);
          n++;
          var hitsYes = x < yr.right + 12 && x + bw > yr.left - 12 && y < yr.bottom + 12 && y + bh > yr.top - 12;
          var tooClose = last && Math.abs(x - last.x) < 90 && Math.abs(y - last.y) < 90;
        } while ((hitsYes || tooClose) && n < 25);
        last = { x: x, y: y };
        if (!no.classList.contains('loose')) {
          var r = no.getBoundingClientRect();
          no.style.left = r.left + 'px'; no.style.top = r.top + 'px';
          no.classList.add('loose');
          void no.offsetWidth;
        }
        no.style.left = Math.round(x) + 'px';
        no.style.top = Math.round(y) + 'px';
      }

      no.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') flee(e); });
      no.addEventListener('pointerdown', flee);
      no.addEventListener('touchstart', flee, { passive: false });
      no.addEventListener('click', flee);

      yes.addEventListener('click', function () {
        document.getElementById('ask').hidden = true;
        no.hidden = true;
        document.getElementById('done').hidden = false;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        for (var k = 0; k < 22; k++) {
          (function (k) {
            setTimeout(function () {
              var s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
              var size = 12 + Math.random() * 14;
              s.setAttribute('viewBox', '0 0 24 24'); s.setAttribute('width', size); s.setAttribute('height', size);
              s.setAttribute('aria-hidden', 'true'); s.setAttribute('class', 'petal');
              s.innerHTML = '<path fill="' + (Math.random() < .5 ? '#C2405F' : '#E7A1B3') + '" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/>';
              s.style.left = (Math.random() * 100) + 'vw';
              s.style.animationDuration = (4 + Math.random() * 3) + 's';
              document.body.appendChild(s);
              setTimeout(function () { s.remove(); }, 8000);
            }, k * 140);
          })(k);
        }
      });

      /* ================= STORY GAME ================= */
      // Songs: put the mp3 files into the "music" folder with these exact names
      var SONGS = [
        { e: '🎸', t: 'Perfect', a: 'Ed Sheeran', src: 'music/perfect.mp3' },
        { e: '🎹', t: 'All of Me', a: 'John Legend', src: 'music/all-of-me.mp3' },
        { e: '🕯️', t: 'A Thousand Years', a: 'Christina Perri', src: 'music/a-thousand-years.mp3' },
        { e: '🌙', t: 'Until I Found You', a: 'Stephen Sanchez', src: 'music/until-i-found-you.mp3' }
      ];
      var PLACES = [
        { e: '🗼', t: 'Paris', d: 'The Eiffel Tower sparkles above you, and the city glows in gold.' },
        { e: '🌅', t: 'Santorini', d: 'The sun is slowly melting into the sea, painting the white houses pink and orange.' },
        { e: '🎈', t: 'Cappadocia', d: 'Hundreds of hot air balloons float quietly over the valleys.' },
        { e: '🏝️', t: 'Maldives', d: 'Warm waves whisper at your feet, and the sky is full of stars.' },
        { e: '🌉', t: 'Istanbul', d: 'The Bosphorus shimmers under the city lights, and seagulls drift in the breeze.' },
        { e: '🏔️', t: 'Swiss Alps', d: 'Snowy mountains surround you, and the air smells like pine and hot chocolate.' }
      ];
      var ACTS = [
        { e: '🍷', t: 'Candlelit dinner', d: 'sitting across from Murat at a candlelit dinner, laughing at something only the two of you understand' },
        { e: '🚶', t: 'Long walk', d: 'walking slowly with Murat, side by side, with nowhere to be and all the time in the world' },
        { e: '🔭', t: 'Stargazing', d: 'lying on a blanket next to Murat, counting stars and making wishes' },
        { e: '💃', t: 'Slow dance', d: 'slow dancing with Murat, your head on his shoulder, the whole world fading away' }
      ];
      var pick = {};
      var story = document.getElementById('story');
      var TOTAL = 4;

      function dots(n) { var h = '<div class="dots">'; for (var i = 1; i <= TOTAL; i++) h += '<i class="' + (i === n ? 'on' : '') + '"></i>'; return h + '</div>'; }
      function optBtn(o, i) { return '<button type="button" class="opt" data-i="' + i + '" style="animation-delay:' + (i * 0.07) + 's"><b>' + o.e + '</b>' + o.t + (o.a ? '<small>' + o.a + '</small>' : '') + '</button>'; }

      function step(n, label, question, list, onPick, extra) {
        story.innerHTML = '<div class="card card-in" style="gap:22px">' + dots(n) + '<p class="step">' + label + '</p><h2 class="q">' + question + '</h2>' +
          '<div class="opts">' + list.map(optBtn).join('') + '</div>' + (extra || '') + '</div>';
        story.querySelectorAll('.opt').forEach(function (b) {
          b.addEventListener('click', function () {
            b.classList.add('picked');
            var i = +b.getAttribute('data-i');
            setTimeout(function () { onPick(list[i]); }, 450);
          });
        });
      }

      function stepSong() { step(1, 'Step 1 of 4', 'Pick a song you love', SONGS, function (o) { pick.song = o; stepPlace(); }); }
      function stepPlace() { step(2, 'Step 2 of 4', 'Where would you love to go?', PLACES, function (o) { pick.place = o; stepWho(); }); }
      function stepWho() {
        story.innerHTML = '<div class="card card-in" style="gap:22px">' + dots(3) + '<p class="step">Step 3 of 4</p><h2 class="q">Who would you go there with?</h2>' +
          '<div class="opts one"><button type="button" class="opt murat" id="murat"><b>💙</b>Murat</button></div>' +
          '<button type="button" class="ghost" id="else">Someone else</button></div>';
        var other = document.getElementById('else');
        var tries = 0, msgs = ['Someone else', 'Hmm, no', 'Not an option', 'Nice try', 'Only Murat'];
        function run(e) {
          if (e && e.cancelable) e.preventDefault();
          tries++; other.textContent = msgs[Math.min(tries, msgs.length - 1)];
          var r = other.getBoundingClientRect();
          if (!other.classList.contains('flee')) { other.style.left = r.left + 'px'; other.style.top = r.top + 'px'; other.classList.add('flee'); void other.offsetWidth; }
          other.style.left = Math.round(16 + Math.random() * Math.max(innerWidth - r.width - 32, 1)) + 'px';
          other.style.top = Math.round(16 + Math.random() * Math.max(innerHeight - r.height - 32, 1)) + 'px';
          if (tries >= 5) setTimeout(function () { other.remove(); }, 400);
        }
        other.addEventListener('pointerenter', function (e) { if (e.pointerType === 'mouse') run(e); });
        other.addEventListener('pointerdown', run);
        other.addEventListener('touchstart', run, { passive: false });
        other.addEventListener('click', run);
        document.getElementById('murat').addEventListener('click', function () {
          this.classList.add('picked'); if (other.parentNode) other.remove();
          setTimeout(stepAct, 450);
        });
      }
      function stepAct() { step(4, 'Step 4 of 4', 'And what would you two do there?', ACTS, function (o) { pick.act = o; stepReady(); }); }
      function stepReady() {
        story.innerHTML = '<div class="card card-in">' +
          '<svg class="heart" width="64" height="64" viewBox="0 0 24 24" fill="#C2405F" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.8 4.5c2.1 0 3.6 1.1 5.2 3 1.6-1.9 3.1-3 5.2-3 3.8 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z"/></svg>' +
          '<h2 class="q">Perfect. Now one last thing…</h2>' +
          '<p class="small">Turn your sound on 🎧<br>Find a quiet place, get comfortable,<br>and read slowly.</p>' +
          '<button type="button" class="cta" id="go">I’m ready</button></div>';
        document.getElementById('go').addEventListener('click', startDream);
      }

      var audio = document.getElementById('song');

      function startDream() {
        try { audio.src = pick.song.src; audio.volume = 0.85; var pr = audio.play(); if (pr && pr.catch) pr.catch(function () { }); } catch (e) { }
        var d = document.getElementById('dream'), box = document.getElementById('dreamLines');
        for (var i = 0; i < 40; i++) { var s = document.createElement('span'); s.className = 'star'; s.style.left = Math.random() * 100 + '%'; s.style.top = Math.random() * 100 + '%'; s.style.animationDelay = (Math.random() * 3) + 's'; d.appendChild(s); }
        var lines = [
          ['Close your eyes for a moment… and breathe.'],
          ['Listen. <em>' + pick.song.t + '</em> is playing softly.'],
          ['You are in <span class="hl">' + pick.place.t + '</span>.', 'hl'],
          [pick.place.d],
          ['And right next to you… is Murat.', 'hl'],
          ['You are ' + pick.act.d + '.'],
          ['He looks at you and smiles, like you are the only person in the world.'],
          ['Feel the warmth. Hear the music. See his eyes.'],
          ['Now close your eyes and stay there for a while…', 'hl']
        ];
        box.innerHTML = lines.map(function (l) { return '<p class="' + (l[1] || '') + '">' + l[0] + '</p>'; }).join('') +
          '<p class="hl" id="end1" style="display:none">Open your eyes 💗</p>' +
          '<p id="end2" style="display:none">One day, this won’t just be a dream.<br> Murat</p>' +
          '<button type="button" class="cta" id="again" style="display:none">Dream again</button>';
        d.hidden = false; void d.offsetWidth; d.classList.add('show');
        function center(el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
        var ps = box.querySelectorAll('p:not([id])');
        ps.forEach(function (p, i) { setTimeout(function () { p.classList.add('in'); center(p); }, 2200 + i * 4200); });
        var t = 2200 + ps.length * 4200 + 20000; // ~20s with eyes closed
        setTimeout(function () {
          ['end1', 'end2'].forEach(function (id, i) { var e = document.getElementById(id); e.style.display = ''; setTimeout(function () { e.classList.add('in'); center(e); }, 300 + i * 2500); });
          var a = document.getElementById('again'); a.style.display = ''; setTimeout(function () { a.classList.add('in'); center(document.getElementById('end2')); }, 5500);
          a.addEventListener('click', function () { location.reload(); });
        }, t);
      }

      document.getElementById('more').addEventListener('click', function () {
        document.getElementById('done').hidden = true;
        story.hidden = false;
        stepSong();
      });
    })();
  </script>
</body>

</html>
